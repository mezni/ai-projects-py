
name: Refund Agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint, test, and evaluate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --locked

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

      - name: Evaluate deterministic refund workflow
        run: uv run python scripts/run_evals.py


      - name: Run tests with coverage
        run: >-
          uv run pytest
          --cov=refund_agent
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=85