[project]
name = "telco-rag"
version = "0.1.0"
description = "A telecom knowledge assistant powered by retrieval-augmented generation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.40.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv",
    "pyyaml>=6.0.3",
    "streamlit",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telco_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

