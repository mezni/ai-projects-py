[project]
name = "refund-agent-ref"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "M.Mezni", email = "mamezni@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.2",
]

[project.scripts]
refund-agent-ref = "refund_agent_ref:main"

[build-system]
