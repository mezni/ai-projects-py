[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "refund-agent"
version = "0.1.0"
description = "A step-by-step AI refund agent built with Python and LangChain"
readme = "README.md"
authors = [
    { name = "M.Mezni", email = "mamezni@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
