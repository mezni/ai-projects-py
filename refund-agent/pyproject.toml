[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "refund-agent"
version = "0.1.0"
description = "A step-by-step AI refund agent built with Python and LangChain"
readme = "README.md"
authors = [
    { name = "M.Mezni", email = "mamezni@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.7",
    "langchain-openai>=1.7.2",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.coverage.run]
source = ["src/refund_agent"]
branch = true
omit = [
    "src/refund_agent/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
