services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: telco-rag-postgres
    environment:
      POSTGRES_DB: telco_rag
      POSTGRES_USER: telco_rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - telco_rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telco_rag -d telco_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  telco_rag_pgdata: