[project]
name = "crm-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "M.Mezni", email = "mamezni@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.31.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
crm-agent = "llm:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "llm"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
